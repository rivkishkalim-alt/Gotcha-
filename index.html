<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<title>שיתוף</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
    background: linear-gradient(135deg, #a8d8ff 0%, #c9b8ff 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .container {
    background: #fefefe;
    border-radius: 28px;
    box-shadow: 0 20px 60px rgba(100, 130, 200, 0.25);
    padding: 48px;
    max-width: 480px;
    width: 100%;
    animation: fadeIn 0.6s ease-out;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .form-group {
    margin-bottom: 18px;
  }
  label {
    display: block;
    margin-bottom: 8px;
    color: #4a5568;
    font-weight: 600;
    font-size: 14px;
  }
  textarea {
    width: 100%;
    padding: 20px;
    border: 2px solid #d6e6ff;
    border-radius: 16px;
    font-size: 16px;
    font-family: inherit;
    transition: all 0.3s ease;
    background: #f5f9ff;
    resize: vertical;
    min-height: 150px;
    line-height: 1.6;
    color: #4a5568;
  }
  textarea::placeholder { color: #a0aec0; }
  textarea:focus {
    outline: none;
    border-color: #b8c9ff;
    background: #ffffff;
    box-shadow: 0 0 0 4px rgba(184, 201, 255, 0.2);
  }
  input[type="file"] {
    width: 100%;
    padding: 10px;
    border: 2px dashed #d6e6ff;
    border-radius: 12px;
    background: #f5f9ff;
    cursor: pointer;
  }
  .submit-btn {
    width: 100%;
    padding: 16px;
    background: linear-gradient(135deg, #a8d8ff 0%, #c9b8ff 100%);
    color: #4a5568;
    border: none;
    border-radius: 16px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.3s ease;
    margin-top: 20px;
  }
  .submit-btn:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 10px 24px rgba(180, 190, 255, 0.5);
  }
  .submit-btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }
  .success-msg, .error-msg {
    display: none;
    padding: 16px;
    border-radius: 16px;
    text-align: center;
    margin-top: 20px;
    font-weight: 600;
    animation: fadeIn 0.4s ease-out;
  }
  .success-msg { background: #e0f5e9; color: #2f6b4f; }
  .error-msg { background: #fde8e8; color: #a33a3a; }
  .success-msg.show, .error-msg.show { display: block; }
</style>
</head>
<body>

<div class="container">
  <form id="contactForm">
    <div class="form-group">
      <textarea id="message" placeholder="כתבו כאן את כל המידע המפליל על החבר..." required></textarea>
    </div>

    <div class="form-group">
      <label for="image1">תמונה מביכה ראשונה (אופציונלי):</label>
      <input type="file" id="image1" accept="image/*">
    </div>

    <div class="form-group">
      <label for="image2">תמונה מביכה שנייה (אופציונלי):</label>
      <input type="file" id="image2" accept="image/*">
    </div>

    <button type="submit" class="submit-btn" id="submitBtn">שליחה 💌</button>
  </form>

  <div class="success-msg" id="successMsg"> ✅ נשלח בהצלחה! </div>
  <div class="error-msg" id="errorMsg"> ❌ משהו השתבש. נסו שוב. </div>
</div>

<script>
  const SANITY_PROJECT_ID = 'epz0dkiz';
  const SANITY_DATASET = 'production';
  const SANITY_TOKEN = 'skpHwz474hUbCVmEzM1SN91oiZgLfEcDHaN4aLFdcNbP4VRHUqNdgrvY89hQSkqHXSkAtTxOTJNuDTvR3phn05Qm4QfY5U5qWiWxHizLInIkkBHf3JXVbehISRd2I9RLIPOIVGN83hfJQHRxXcv5BkGB9vdnTAar0b0ENMP4RrfkAnKcfH5s';

  // פונקציית כיווץ מתוקנת שעובדת פיקס
  function compressImage(file, maxWidth = 800, quality = 0.7) {
    return new Promise((resolve, reject) => {
      if (!file) return resolve(null);
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = (event) => {
        const img = new Image();
        img.src = event.target.result;
        img.onload = () => {
          const canvas = document.createElement('canvas');
          let width = img.width;
          let height = img.height;

          if (width > height) {
            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }
          } else {
            if (height > maxWidth) {
              width = Math.round((width * maxWidth) / height);
              height = maxWidth;
            }
          }

          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          canvas.toBlob((blob) => {
            if (blob) {
              resolve(new File([blob], file.name, { type: 'image/jpeg' }));
            } else {
              reject(new Error('Compression failed'));
            }
          }, 'image/jpeg', quality);
        };
      };
      reader.onerror = (error) => reject(error);
    });
  }

  async function uploadImageToSanity(file) {
    if (!file) return null;

    const url = `https://${SANITY_PROJECT_ID}.api.sanity.io/v2021-06-07/assets/images/${SANITY_DATASET}`;
    const response = await fetch(url, {
      method: 'POST',
      headers: {
        'Authorization': `Bearer ${SANITY_TOKEN}`,
        'Content-Type': file.type
      },
      body: file
    });

    if (!response.ok) throw new Error('Image upload failed');
    const result = await response.json();
    return {
      _type: 'image',
      asset: {
        _type: 'reference',
        _ref: result.document._id
      }
    };
  }

  document.getElementById('contactForm').addEventListener('submit', async function(e) {
    e.preventDefault();

    const message = document.getElementById('message').value;
    const submitBtn = document.getElementById('submitBtn');
    const successMsg = document.getElementById('successMsg');
    const errorMsg = document.getElementById('errorMsg');

    // שליפה נכונה של הקבצים הבודדים מהמערך
    const file1 = document.getElementById('image1').files[0];
    const file2 = document.getElementById('image2').files[0];

    successMsg.classList.remove('show');
    errorMsg.classList.remove('show');
    submitBtn.disabled = true;
    submitBtn.textContent = 'מעבד ומעלה נתונים...';

    try {
      // כיווץ בזמן אמת (מוריד את משקל התמונה ב-90%)
      const compressedFile1 = file1 ? await compressImage(file1) : null;
      const compressedFile2 = file2 ? await compressImage(file2) : null;

      // העלאה מהירה לסניטי
      const image1Ref = await uploadImageToSanity(compressedFile1);
      const image2Ref = await uploadImageToSanity(compressedFile2);

      const sanityMutationsUrl = `https://${SANITY_PROJECT_ID}.api.sanity.io/v2021-06-07/data/mutate/${SANITY_DATASET}`;

      const newDocument = {
        _type: 'prankTarget',
        snifInfo: message,
        embarrassingImage1: image1Ref,
        embarrassingImage2: image2Ref
      };

      const response = await fetch(sanityMutationsUrl, {
        method: 'POST',
        headers: {
          'Authorization': `Bearer ${SANITY_TOKEN}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          mutations: [{ create: newDocument }]
        })
      });

      if (!response.ok) {
        const errorData = await response.json();
        throw new Error(errorData.error?.message || 'Mutation failed');
      }

      successMsg.classList.add('show');
      this.reset();
      setTimeout(() => { successMsg.classList.remove('show'); }, 3000);
    } catch (error) {
      console.error(error);
      errorMsg.classList.add('show');
      setTimeout(() => { errorMsg.classList.remove('show'); }, 3000);
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'שליחה 💌';
    }
  });
</script>
</body>
</html>
